name: PR Thank You & Aliit Fellowship

on:
  pull_request_review:
    types: [submitted]
  # pull_request_target gives a write-capable context for fork PRs on merge.
  pull_request_target:
    types: [closed]

permissions: {}

# Serialize thank-you jobs per PR so concurrent approvals cannot race past dedupe.
concurrency:
  group: pr-thank-you-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  thank-on-approval:
    if: >-
      github.event_name == 'pull_request_review'
      && github.event.review.state == 'approved'
      && github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # issues:write is required: PR comments use the issues comments API.
    # DEVREL_TRACKER_TOKEN is required for fork PRs: GITHUB_TOKEN is read-only
    # on pull_request_review events from forks.
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post approval comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.DEVREL_TRACKER_TOKEN }}
          script: |
            const MARKER = '<!-- pr-thank-you-approval -->';
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyPosted = comments.some(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER)
            );
            if (alreadyPosted) {
              core.info(`Approval thank-you already posted on PR #${pr.number}; skipping.`);
              return;
            }

            const body = [
              MARKER,
              `Hey @${author}, your PR has been approved! 🎉`,
              '',
              'Thank you for contributing to the Midnight ecosystem. This is exactly the kind of hands-on work that strengthens the network.',
              '',
              'While you wait for merge, here are a few ways to amplify your reach:',
              '',
              '- Make sure your project repo has the `midnightntwrk` and `compact` topics so it shows up in our developer reporting',
              '- Share it on the [Midnight Forum](https://forum.midnight.network/)',
              '- Drop it in our [Discord community](https://discord.gg/q7EmdKyM4U)',
              '- Claim your points on [Zealy](https://zealy.io/cw/midnightnetwork/questboard/85ce0bb0-d027-42a6-a1e6-444589f66f66/d6cd1b7d-28bb-4702-9273-872db33dd525) by submitting your DApp',
              '',
              'If you want to keep building with Midnight, the **Aliit Fellowship** is a great next step. Aliit means "family" in Mandalorian — it\'s Midnight\'s selective technical fellowship for builders who bring depth and share knowledge about privacy-first tech. Applications are reviewed on a rolling basis.',
              '',
              '👉 [Learn more and apply at midnight.network/aliit](https://midnight.network/aliit)',
              '',
              'Thanks again for your contribution!',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });

            core.info(`Posted approval thank-you on PR #${pr.number}.`);

  thank-on-merge:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post merge comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.DEVREL_TRACKER_TOKEN }}
          script: |
            const MARKER = '<!-- pr-thank-you-merge -->';
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const alreadyPosted = comments.some(
              (c) => c.user?.type === 'Bot' && c.body?.includes(MARKER)
            );
            if (alreadyPosted) {
              core.info(`Merge thank-you already posted on PR #${pr.number}; skipping.`);
              return;
            }

            const body = [
              MARKER,
              `Congrats @${author}, your contribution has been merged! 🚀`,
              '',
              'Your work is now part of the Midnight Awesome DApps list. Thank you for helping grow the ecosystem.',
              '',
              'Here are some ways to amplify your reach:',
              '',
              '- Add the `midnightntwrk` and `compact` topics to your project repo so it appears in our developer reporting',
              '- Post about it on the [Midnight Forum](https://forum.midnight.network/)',
              '- Share it with our [Discord community](https://discord.gg/q7EmdKyM4U)',
              '- Claim your points on [Zealy](https://zealy.io/cw/midnightnetwork/questboard/85ce0bb0-d027-42a6-a1e6-444589f66f66/d6cd1b7d-28bb-4702-9273-872db33dd525) by submitting your DApp',
              '- [Apply for a Dev Hangout](https://share.hsforms.com/1Ts4ombCFRLWwH723RZ6_bgqtj5y) to share your work on our weekly livestream',
              '',
              'Here\'s how you can keep building with Midnight:',
              '',
              '- Ready to turn your project into a business? Apply to the [Build Club](https://midnight.network/build-club)',
              '- Looking to make an impact beyond your code? Join the [Aliit Fellowship](https://midnight.network/aliit)',
              '- Become certified by completing [Midnight Academy](https://academy.midnight.network/)',
              '',
              'We look forward to seeing more from you!',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });

            core.info(`Posted merge thank-you on PR #${pr.number}.`);
